name: vocivo-pbx

services:
  freeswitch:
    build:
      context: ./freeswitch
      args:
        FREESWITCH_VERSION: ${FREESWITCH_VERSION:-v1.11.1}
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      PBX_ENGINE: freeswitch
    ulimits:
      nofile:
        soft: 200000
        hard: 200000
    cap_add:
      - SYS_NICE
    volumes:
      - freeswitch-db:/usr/local/freeswitch/var/lib/freeswitch/db
      - freeswitch-certs:/usr/local/freeswitch/etc/freeswitch/tls
      - freeswitch-recordings:/var/lib/vocivo/recordings
      - freeswitch-logs:/usr/local/freeswitch/var/log/freeswitch
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/freeswitch/bin/fs_cli -H 127.0.0.1 -P 8021 -p \"$$ESL_PASSWORD\" -x status >/dev/null 2>&1"]
      interval: 20s
      timeout: 5s
      retries: 6
      start_period: 60s

  esl-listener:
    build: ./esl-listener
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      ESL_HOST: 127.0.0.1
      ESL_PORT: 8021
      HEALTH_PORT: 8088
      APNS_ENABLED: ${APNS_ENABLED:?APNS_ENABLED is required}
      APNS_TEAM_ID: ${APNS_TEAM_ID:?APNS_TEAM_ID is required}
      APNS_KEY_ID: ${APNS_KEY_ID:?APNS_KEY_ID is required}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:?APNS_BUNDLE_ID is required}
      APNS_KEY_PATH: ${APNS_KEY_PATH:?APNS_KEY_PATH is required}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-production}
      FCM_ENABLED: ${FCM_ENABLED:?FCM_ENABLED is required}
      FCM_SERVICE_ACCOUNT_PATH: ${FCM_SERVICE_ACCOUNT_PATH:?FCM_SERVICE_ACCOUNT_PATH is required}
    volumes:
      - ./secrets/apns-auth-key.p8:/run/secrets/apns-auth-key.p8:ro
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
      - ./freeswitch/config/dialplan/default/vocivo.xml:/run/vocivo/dialplan/vocivo.xml:ro
    depends_on:
      freeswitch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 20s
      timeout: 5s
      retries: 5

  coturn:
    image: coturn/coturn:4.6.3-r3
    restart: unless-stopped
    network_mode: host
    user: "0:0"
    env_file: .env
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        case "$$TURN_TLS_DOMAIN" in ''|*[!A-Za-z0-9.-]*) echo "Invalid TURN_TLS_DOMAIN" >&2; exit 1;; esac
        case "$$PBX_PUBLIC_IP" in ''|*[!0-9A-Fa-f:.]*) echo "Invalid PBX_PUBLIC_IP" >&2; exit 1;; esac
        case "$$PBX_CARRIER_BIND_IP" in ''|*[!0-9A-Fa-f:.]*) echo "Invalid PBX_CARRIER_BIND_IP" >&2; exit 1;; esac
        case "$${TURN_MIN_PORT:-30000}" in *[!0-9]*) echo "Invalid TURN_MIN_PORT" >&2; exit 1;; esac
        case "$${TURN_MAX_PORT:-39999}" in *[!0-9]*) echo "Invalid TURN_MAX_PORT" >&2; exit 1;; esac
        secret="$$(cat /run/secrets/turn_auth_secret)"
        test "$${#secret}" -ge 32
        until cert="$$(find /caddy/caddy/certificates -type f -path "*/$$TURN_TLS_DOMAIN/$$TURN_TLS_DOMAIN.crt" -print -quit)" && test -n "$$cert"; do sleep 2; done
        key="$${cert%.crt}.key"
        test -r "$$key"
        umask 077
        cat > /run/vocivo/turnserver.conf <<EOF
        listening-port=3478
        tls-listening-port=5349
        min-port=$${TURN_MIN_PORT:-30000}
        max-port=$${TURN_MAX_PORT:-39999}
        # DigitalOcean Reserved IPs are 1:1 NATed to the droplet anchor IP.
        # Bind relay sockets only to that anchor and advertise the Reserved IP.
        relay-ip=$$PBX_CARRIER_BIND_IP
        external-ip=$$PBX_PUBLIC_IP/$$PBX_CARRIER_BIND_IP
        realm=$$TURN_REALM
        use-auth-secret
        static-auth-secret=$$secret
        cert=$$cert
        pkey=$$key
        fingerprint
        stale-nonce
        mobility
        no-cli
        no-dtls
        no-multicast-peers
        log-file=stdout
        simple-log
        proc-user=nobody
        proc-group=nogroup
        pidfile=/tmp/turnserver.pid
        EOF
        exec turnserver -c /run/vocivo/turnserver.conf
    secrets:
      - turn_auth_secret
    volumes:
      - caddy-data:/caddy:ro
    tmpfs:
      - /run/vocivo:size=1m,mode=0700
    healthcheck:
      test: ["CMD-SHELL", "turnutils_stunclient -p 3478 127.0.0.1 2>&1 | grep -q 'reflexive addr'"]
      interval: 30s
      timeout: 8s
      retries: 5

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    env_file: .env
    ports:
      - "80:80"
    networks:
      edge:
        ipv4_address: 172.30.0.2
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      freeswitch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 8s
      retries: 5

  edge-router:
    image: haproxy:3.2.22-alpine
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    env_file: .env
    command:
      - /bin/sh
      - -ec
      - |
        case "$$TURN_TLS_DOMAIN" in ''|*[!A-Za-z0-9.-]*) echo "Invalid TURN_TLS_DOMAIN" >&2; exit 1;; esac
        sed "s|@@TURN_TLS_DOMAIN@@|$$TURN_TLS_DOMAIN|g" /usr/local/etc/haproxy/haproxy.cfg.template > /tmp/haproxy.cfg
        exec haproxy -W -db -f /tmp/haproxy.cfg
    ports:
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      edge:
        ipv4_address: 172.30.0.3
    volumes:
      - ./haproxy/haproxy.cfg.template:/usr/local/etc/haproxy/haproxy.cfg.template:ro
    tmpfs:
      - /tmp:size=16m,mode=1777
    depends_on:
      caddy:
        condition: service_healthy
      coturn:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "haproxy -c -f /tmp/haproxy.cfg >/dev/null 2>&1 && nc -z -w 3 host.docker.internal 5349"]
      interval: 20s
      timeout: 5s
      retries: 5

volumes:
  freeswitch-db:
  freeswitch-certs:
  freeswitch-recordings:
  freeswitch-logs:
  caddy-data:
  caddy-config:

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.0.0/24

secrets:
  turn_auth_secret:
    file: ${TURN_AUTH_SECRET_FILE:-./secrets/turn-auth-secret}
