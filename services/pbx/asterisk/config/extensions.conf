[general]
static=yes
writeprotect=yes
clearglobalvars=no

[globals]
OUTBOUND_CALLER_ID=${TELNYX_OUTBOUND_CALLER_ID}

[vocivo-internal]
; Private extension calls stay on the PBX and never enter the PSTN trunk.
exten => _XX,1,Goto(vocivo-extension,${EXTEN},1)
exten => _XXX,1,Goto(vocivo-extension,${EXTEN},1)
exten => _XXXX,1,Goto(vocivo-extension,${EXTEN},1)
exten => _XXXXX,1,Goto(vocivo-extension,${EXTEN},1)
; Public numbers must be E.164. Per-tenant permissions are enforced before dial.
exten => _+X.,1,NoOp(Vocivo outbound PSTN call ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(CALLERID(num)=${OUTBOUND_CALLER_ID})
 same => n,Dial(PJSIP/${EXTEN}@telnyx,60,b(ringback^s^1))
 same => n,Hangup()
exten => *97,1,VoiceMailMain(${CALLERID(num)}@vocivo)
 same => n,Hangup()

[vocivo-extension]
exten => _X!,1,NoOp(Free internal extension call to ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,GotoIf($["${DIALSTATUS}"="BUSY"]?busy:noanswer)
 same => n(busy),VoiceMail(${EXTEN}@vocivo,b)
 same => n,Hangup()
 same => n(noanswer),VoiceMail(${EXTEN}@vocivo,u)
 same => n,Hangup()

[from-telnyx]
exten => _X!,1,NoOp(Inbound Telnyx DID ${EXTEN})
 same => n,Goto(vocivo-inbound,s,1)

[vocivo-inbound]
exten => s,1,Answer()
 same => n,Playback(custom/company-welcome)
 same => n,Background(custom/company-menu)
 same => n,WaitExten(8)
exten => 1,1,Queue(sales,t,,,180)
exten => 2,1,Queue(operations,t,,,180)
exten => 9,1,Read(TARGET,custom/enter-extension,5,,2,8)
 same => n,Goto(vocivo-extension,${TARGET},1)
exten => i,1,Playback(pbx-invalid)
 same => n,Goto(s,2)
exten => t,1,VoiceMail(2000@vocivo,u)

[ringback]
exten => s,1,Playtones(ring)
 same => n,Return()
