[global]
type=global
user_agent=Vocivo-PBX

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=${PBX_PUBLIC_IP}
external_signaling_address=${PBX_PUBLIC_IP}
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

[vocivo-endpoint](!)
type=endpoint
context=vocivo-internal
disallow=all
allow=opus,g722,ulaw,alaw
direct_media=no
force_rport=yes
rewrite_contact=yes
rtp_symmetric=yes
ice_support=yes
dtmf_mode=rfc4733
timers=yes

[vocivo-auth](!)
type=auth
auth_type=userpass

[vocivo-aor](!)
type=aor
max_contacts=5
remove_existing=no
qualify_frequency=30

; Provisioned extensions are generated by the Vocivo control plane in
; /etc/asterisk/pjsip_extensions.conf and never committed with secrets.
#include pjsip_extensions.conf

[telnyx-auth]
type=auth
auth_type=userpass
username=${TELNYX_SIP_USERNAME}
password=${TELNYX_SIP_PASSWORD}

[telnyx-aor]
type=aor
contact=sip:${TELNYX_SIP_PROXY}:5060
qualify_frequency=30

[telnyx-registration]
type=registration
outbound_auth=telnyx-auth
server_uri=sip:${TELNYX_SIP_PROXY}:5060
client_uri=sip:${TELNYX_SIP_USERNAME}@${TELNYX_SIP_PROXY}
retry_interval=30
forbidden_retry_interval=300
expiration=600
transport=transport-udp

[telnyx]
type=endpoint
transport=transport-udp
context=from-telnyx
disallow=all
allow=ulaw,alaw,g722
outbound_auth=telnyx-auth
aors=telnyx-aor
from_user=${TELNYX_OUTBOUND_CALLER_ID}
from_domain=${TELNYX_SIP_PROXY}
direct_media=no
rtp_symmetric=yes
force_rport=yes

[telnyx-identify]
type=identify
endpoint=telnyx
match=sip.telnyx.com
