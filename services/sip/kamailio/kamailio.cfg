#!KAMAILIO
# Vocivo SIP edge: registrar + fork for internal AORs, PSTN to FreeSWITCH, media via RTPEngine.
# Authentication is Digest verified by the Vocivo API. SIP passwords never live in this image.

#!define FLT_NATS 1
#!define FLT_ACC 2
#!define FLT_FS 3

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tcp:127.0.0.1:8080

# L_INFO and up. The script's own INVITE and inbound lines are L_INFO, and at
# the default level not one of them ever reached the log: the first calls
# over the trunk could not be found in it at all.
debug=2

alias=sip.vocivo.app

tcp_accept_no_cl=yes

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "db_sqlite.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "http_client.so"
loadmodule "async.so"
loadmodule "jansson.so"
loadmodule "auth.so"
loadmodule "uac.so"
loadmodule "dispatcher.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"
# is_ip_in_subnet, for matching a carrier signalling range rather than a
# single address: Telnyx publishes /26s and /29s, not a list of hosts.
loadmodule "ipops.so"
# Call records for the calls that never touch FreeSWITCH (extension to
# extension): queued in memory as they happen, posted to the API by a timer.
loadmodule "mqueue.so"
loadmodule "rtimer.so"
loadmodule "htable.so"

modparam("mqueue", "mqueue", "name=cdr;size=4000")
modparam("rtimer", "timer", "name=cdr;interval=1;mode=1;")
modparam("rtimer", "exec", "timer=cdr;route=CDR_FLUSH")
# Which live dialogs are ours to record: set on the INVITE, cleared on BYE,
# expired after four hours so a lost BYE cannot pin memory.
modparam("htable", "htable", "cdr=>size=10;autoexpire=14400;")

modparam("usrloc", "db_url", "sqlite:////var/lib/kamailio/usrloc.db")
modparam("usrloc", "db_mode", 1)
modparam("usrloc", "handle_lost_tcp", 1)
modparam("usrloc", "close_expired_tcp", 1)
modparam("async", "workers", 16)
modparam("registrar", "method_filtering", 1)
modparam("registrar", "append_branches", 1)
modparam("registrar", "max_contacts", 8)
modparam("registrar", "received_avp", "$avp(RECEIVED)")
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 120)
modparam("websocket", "cors_mode", 2)
modparam("sanity", "autodrop", 0)

event_route[xhttp:request] {
    if ($Rp != 8080) {
        xhttp_reply("403", "Forbidden", "", "");
        exit;
    }
    if (!ws_handle_handshake()) {
        xlog("L_WARN", "websocket handshake failed from $si\n");
        exit;
    }
}

route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    # WebSocket frames are already delimited. sanity check_cl() 400s native iOS
    # REGISTER and can hide Authorization on the digest retry.
    if ($Rp != 8080 && !sanity_check("1511", "7")) {
        xlog("L_WARN", "malformed SIP from $si $rm $rU\n");
        sl_send_reply("400", "Bad Request");
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # Every X-Vocivo header is something this edge tells the switch behind it
    # about a call it has already authorised, and none of them may arrive from
    # the network. They used to: the script only added its own when the sender
    # had not already supplied one, and never touched the rest. A client could
    # therefore claim X-Vocivo-Flow: inbound and walk into another tenant's
    # inbound plan, put any number on the world's caller ID displays with
    # X-Vocivo-Caller-ID, or reach a shell on the media host through the route
    # id the hangup hook quotes. They are removed here, once, before any route
    # reads them, and put back below only with values the API vouched for.
    #
    # Read before anything is removed, so the routes below never depend on
    # whether a removed header can still be read back.
    route(ROUTE_TOKEN);

    # Loopback port 5060 is FreeSWITCH placing a leg to a phone, and its
    # headers are ours. Everything else — the carrier on public 5060, the apps
    # on the WebSocket port — is the network.
    if ($Rp == 8080 || $si != "127.0.0.1") {
        route(UNTRUST_ROUTING);
        # The carrier's own signalling addresses are the exception, and only
        # for the headers that describe who is calling: on the Call Control
        # path it is the API that set them, on a call it had already decided,
        # and the callee's phone draws its incoming-call screen from them.
        route(TRUNK_SOURCE);
        if ($var(from_trunk) != 1) {
            route(UNTRUST_IDENTITY);
        }
    }

    if (nat_uac_test("64") || $Rp == 8080) {
        force_rport();
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else if (!add_contact_alias()) {
            xlog("L_WARN", "websocket contact alias failed from $si $rm $rU proto=$proto rp=$Rp\n");
        }
    }

    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    if (is_method("INVITE|ACK|BYE|CANCEL|UPDATE|PRACK")) {
        if (nat_uac_test("19")) {
            setflag(FLT_NATS);
            force_rport();
        }
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) {
            # The caller gave up before the answer: free the media ports.
            rtpengine_manage();
            if ($sht(cdr=>$ci) != $null) {
                $var(cdr_flow) = "";
                $var(cdr_event) = "cancel";
                route(CDR_ENQUEUE);
                $sht(cdr=>$ci) = $null;
            }
            route(RELAY);
        }
        exit;
    }

    if (is_method("INVITE")) {
        t_on_reply("MANAGE_REPLY");
        route(INVITE);
        exit;
    }

    if (has_totag() && loose_route()) {
        # Nothing here released rtpengine's ports when a call ended, so every
        # call held four of them until rtpengine's own timeout — and with a
        # hundred ports in the pool, "Ran out of ports" arrived within a day.
        if (is_method("BYE")) {
            rtpengine_manage();
            if ($sht(cdr=>$ci) != $null) {
                $var(cdr_flow) = "";
                $var(cdr_event) = "bye";
                route(CDR_ENQUEUE);
                $sht(cdr=>$ci) = $null;
            }
        }
        if (is_method("REFER")) {
            $var(rto) = $(hdr(Refer-To){nameaddr.uri}{uri.user});
            if ($var(rto) =~ "^conf-") {
                $rU = $var(rto);
                rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
                route(FORK_FS);
                exit;
            }
        }
        route(RELAY);
        exit;
    }

    if (is_method("REFER|NOTIFY")) {
        route(REFER);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) route(RELAY);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

# Written by docker-entrypoint.sh from VOCIVO_TRUNK_SOURCES. Defines
# route[TRUNK_SOURCE], which sets $var(from_trunk) for a carrier address.
include_file "/etc/kamailio/trunk-sources.cfg"

route[REGISTER] {
    # UDP scanners hammer numeric From-users. Do not spend sip-auth (or async
    # workers) on them or WebSocket REGISTER from vocivo.app stalls with 1006.
    if ($Rp != 8080 && $fU =~ "^[0-9]{1,8}$") {
        sl_send_reply("403", "Forbidden");
        exit;
    }
    xlog("L_WARN", "REGISTER $fU proto=$proto rp=$Rp cl=$cl\n");
    if (!is_present_hf("Authorization")) {
        xlog("L_WARN", "REGISTER challenge $fU\n");
        route(CHALLENGE);
        exit;
    }
    if (!route(AUTH)) {
        xlog("L_WARN", "REGISTER auth failed $fU\n");
        route(CHALLENGE);
        exit;
    }
    if (!save("location")) {
        xlog("L_WARN", "REGISTER save failed $fU contact=$ct\n");
        sl_reply_error();
        exit;
    }
    xlog("L_WARN", "REGISTER ok $fU from $si transport=$proto\n");
    exit;
}

route[CHALLENGE] {
    $var(body) = '{"username":"' + $fU + '"}';
    $var(url) = "http://127.0.0.1:8081/sip-nonce";
    if (http_client_query($var(url), $var(body), "application/json", "$var(chal)") < 0) {
        xlog("L_ERR", "sip-nonce unreachable for $fU\n");
        www_challenge("$env(VOCIVO_SIP_REALM)", "1");
        exit;
    }
    jansson_get("nonce", "$var(chal)", "$var(nonce)");
    if ($var(nonce) == "") {
        xlog("L_WARN", "sip-nonce empty for $fU: $var(chal)\n");
        www_challenge("$env(VOCIVO_SIP_REALM)", "1");
        exit;
    }
    append_to_reply("WWW-Authenticate: Digest realm=\"$env(VOCIVO_SIP_REALM)\", nonce=\"$var(nonce)\", algorithm=MD5, qop=\"auth\"\r\n");
    sl_send_reply("401", "Unauthorized");
    exit;
}

route[AUTH] {
    $var(body) = '{"method":"' + $rm + '","authorization":"' + $(hdr(Authorization){s.escape.common}) + '","fromUser":"' + $(fU{s.escape.common}) + '","toUser":"' + $(tU{s.escape.common}) + '","requestUser":"' + $(rU{s.escape.common}) + '","routeToken":"' + $var(rtok) + '"}';
    $var(url) = "http://127.0.0.1:8081/sip-auth";
    if (http_client_query($var(url), $var(body), "application/json", "$var(res)") < 0) {
        xlog("L_ERR", "sip-auth unreachable for $fU\n");
        send_reply("500", "Auth service unavailable");
        exit;
    }
    if ($var(res) =~ "\"ok\"\\s*:\\s*true") {
        route(READ_ROUTE);
        return 1;
    }
    xlog("L_WARN", "sip-auth rejected $fU: $var(res)\n");
    return -1;
}

# What the edge decides, and nobody else: where a call is going, what number it
# may present, and which authorisation it is spending. Removed from every
# request off this box, and put back below only with the API's own values —
# the route token included, so that what FreeSWITCH records is the token this
# script checked rather than whatever arrived under that name.
route[UNTRUST_ROUTING] {
    remove_hf("X-Vocivo-Flow");
    remove_hf("X-Vocivo-Caller-ID");
    remove_hf("X-Vocivo-Route-Token");
    remove_hf("X-Vocivo-Call-UUID");
}

# Who the callee is told is ringing. Nothing on this edge sets these — they
# belong to the carrier's Call Control path, where the API sets them — so a
# client sending them is a colleague's name and photograph on somebody else's
# phone.
route[UNTRUST_IDENTITY] {
    remove_hf("X-Vocivo-Route-ID");
    remove_hf("X-Vocivo-Call-Type");
    remove_hf("X-Vocivo-Caller-Name");
    remove_hf("X-Vocivo-Caller-Extension");
    remove_hf("X-Vocivo-Caller-Photo");
    remove_hf("X-Vocivo-Company-Name");
    remove_hf("X-Vocivo-Organization-ID");
}

# The signed authorisation /api/voice/route gave the client for this one call,
# taken off the message as it arrived. Only something shaped like a token is
# kept, so nothing a client invents reaches the API's parser — or the call
# record — as anything but an empty string.
route[ROUTE_TOKEN] {
    $var(rtok) = "";
    if ($(hdr(X-Vocivo-Route-Token)) =~ "^[A-Za-z0-9_-]+[.][A-Za-z0-9_-]+$") {
        $var(rtok) = $(hdr(X-Vocivo-Route-Token));
    }
}

# What the API said about that token: the route it belongs to and the number it
# may present. Both are re-checked against their own shape here, because the
# route id becomes an argument to a shell command on the media host and the
# caller ID becomes a P-Asserted-Identity on the trunk.
route[READ_ROUTE] {
    $var(auth_route_id) = "";
    $var(auth_caller_id) = "";
    jansson_get("routeId", "$var(res)", "$var(auth_route_id)");
    jansson_get("callerId", "$var(res)", "$var(auth_caller_id)");
    if (!($var(auth_route_id) =~ "^[A-Za-z0-9_-]{16,80}$")) {
        $var(auth_route_id) = "";
    }
    if (!($var(auth_caller_id) =~ "^\+[1-9][0-9]{6,14}$")) {
        $var(auth_caller_id) = "";
    }
}

# A call between two extensions carries no Digest of its own — the phone
# authenticated when it registered — so the route token is the whole of its
# authorisation. Without this an INVITE straight at the WebSocket port rang
# any extension on the platform, in any tenant, and woke its phone with a push.
route[ROUTE_CHECK] {
    if ($var(rtok) == "") {
        return -1;
    }
    $var(body) = '{"requestUser":"' + $(rU{s.escape.common}) + '","routeToken":"' + $var(rtok) + '"}';
    if (http_client_query("http://127.0.0.1:8081/sip-auth", $var(body), "application/json", "$var(res)") < 0) {
        xlog("L_ERR", "sip-auth unreachable for internal $rU\n");
        return -1;
    }
    route(READ_ROUTE);
    if ($var(auth_route_id) == "") {
        return -1;
    }
    return 1;
}

route[REFER] {
    if (!has_totag()) {
        record_route();
    }
    if ($rU =~ "^conf-") {
        rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
        route(FORK_FS);
        exit;
    }
    if (lookup("location")) {
        rtpengine_manage("replace-origin replace-session-connection ICE=force DTLS=passive SDES-off RTCP-MUX RTP/SAVPF");
        if (is_method("INVITE")) {
            t_on_failure("MANAGE_FAILURE");
        }
        route(RELAY);
        exit;
    }
    sl_send_reply("404", "Not Found");
    exit;
}

route[INVITE] {
    if (!has_totag()) {
        record_route();
    }

    if ($rU =~ "^conf-") {
        append_hf("X-Vocivo-Flow: conference\r\n");
        rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
        route(FORK_FS);
        exit;
    }

    if ($rU =~ "^\+?[1-9][0-9]{6,14}$") {
        # An E.164 destination on public 5060 is one of two things: a call the
        # carrier is delivering to one of our own DIDs, or somebody trying to
        # originate PSTN on our account. The only thing that separates them is
        # where it came from.
        route(TRUNK_SOURCE);
        if ($Rp != 8080 && $var(from_trunk) == 1 && $env(VOCIVO_SIP_INBOUND) == "1") {
            xlog("L_NOTICE", "inbound DID $rU from $fU via trunk $si ci=$ci\n");
            append_hf("X-Vocivo-Flow: inbound\r\n");
            rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
            route(FORK_FS);
            exit;
        }

        # UDP/TCP 5060 is scanned. Only the authenticated WebSocket edge may
        # originate PSTN, and only the carrier's own signalling addresses may
        # deliver inbound. Everything else is refused.
        if ($Rp != 8080) {
            xlog("L_WARN", "reject unauthenticated E.164 INVITE from $si $rU rp=$Rp\n");
            sl_send_reply("403", "Forbidden");
            exit;
        }
        if (!is_present_hf("Authorization")) {
            route(CHALLENGE);
            exit;
        }
        if (!route(AUTH)) {
            route(CHALLENGE);
            exit;
        }
        # The password proves who is calling; it does not authorise the call.
        # /api/voice/route is where the plan, the outbound policy, the wallet
        # and the ownership of the caller ID are checked, and it signs all of
        # that into the route token the client presented — which nothing on
        # this edge used to look at. The caller ID and the route id below are
        # the API's own answer, not the client's headers.
        if ($var(auth_route_id) == "" || $var(auth_caller_id) == "") {
            xlog("L_WARN", "refusing outbound $rU from $fU: no authorised route for this call\n");
            sl_send_reply("403", "Call not authorised");
            exit;
        }
        append_hf("X-Vocivo-Flow: outbound\r\n");
        append_hf("X-Vocivo-Caller-ID: $var(auth_caller_id)\r\n");
        append_hf("X-Vocivo-Route-ID: $var(auth_route_id)\r\n");
        # The token goes on again in the shape this script checked, so the call
        # record FreeSWITCH writes cannot be broken by a hand-made header.
        append_hf("X-Vocivo-Route-Token: $var(rtok)\r\n");
        rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
        route(FORK_FS);
        exit;
    }

    # Telnyx Call Control Dial to sip.vocivo.app still arrives on public 5060.
    # Fork live contacts immediately. For long Vocivo AORs, wake + one 8s wait
    # so a just-pushed iPhone can REGISTER. Never loop async_route: each hop
    # adds a tm branch and real calls died at tries=13 with t_suspend failed.
    if ($Rp != 8080 && $si != "127.0.0.1") {
        if (lookup("location")) {
            xlog("L_INFO", "INVITE $fU -> $rU public registered proto=$proto\n");
            rtpengine_manage("replace-origin replace-session-connection ICE=force DTLS=passive SDES-off RTCP-MUX RTP/SAVPF");
            t_on_failure("WAKEUP");
            route(RELAY);
            exit;
        }
        if ($rU =~ "^[A-Za-z][A-Za-z0-9_.-]{15,79}$") {
            xlog("L_INFO", "INVITE $fU -> $rU public wakeup then one wait\n");
            route(WAKEUP_NOW);
            $avp(waited) = 0;
            route(WAIT_REGISTER);
            exit;
        }
        xlog("L_WARN", "reject untrusted internal INVITE from $si $rU rp=$Rp proto=$proto\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }

    # Wake the iPhone, then fork whoever is already registered (usually web).
    xlog("L_INFO", "INVITE $fU -> $rU sip-wakeup then fork registered contacts\n");
    if ($Rp == 8080) {
        # From one of the apps, to a colleague. The registration was
        # authenticated; this call was not, until now — an INVITE at the
        # WebSocket port rang whatever extension it named, in whatever tenant,
        # and woke that phone with a push notification on the way.
        if (!route(ROUTE_CHECK)) {
            xlog("L_WARN", "refusing internal INVITE $fU -> $rU: no authorised route for this call\n");
            sl_send_reply("403", "Call not authorised");
            exit;
        }
        append_hf("X-Vocivo-Flow: internal\r\n");
        append_hf("X-Vocivo-Route-ID: $var(auth_route_id)\r\n");
        append_hf("X-Vocivo-Route-Token: $var(rtok)\r\n");
        # This call is relayed here and FreeSWITCH never sees it, so its record
        # has to start here. (Legs FreeSWITCH places to a phone arrive from
        # 127.0.0.1 and it records those itself.)
        $sht(cdr=>$ci) = 1;
        $var(cdr_event) = "invite";
        $var(cdr_flow) = "internal";
        route(CDR_ENQUEUE);
    }
    route(WAKEUP_NOW);
    if (lookup("location")) {
        xlog("L_INFO", "INVITE $fU -> $rU registered proto=$proto\n");
        if ($avp(uuid) != "") {
            append_hf("X-Vocivo-Call-UUID: $avp(uuid)\r\n");
        }
        rtpengine_manage("replace-origin replace-session-connection ICE=force DTLS=passive SDES-off RTCP-MUX RTP/SAVPF");
        t_on_failure("WAKEUP");
        route(RELAY);
        exit;
    }
    $avp(waited) = 0;
    route(WAIT_REGISTER);
    exit;
}

# One line per call event, keyed by Call-ID. The INVITE names the flow, the
# route the API issued for it and the callee; later events carry only the
# parties, and the API joins them by Call-ID.
#
# The flow is read from $var(cdr_flow), set by whichever route enqueued this,
# and not from the header: remove_hf takes a header off the message that is
# relayed, but $hdr() still reads the one that arrived, so a record built from
# the header would quote the client's claim rather than what the edge decided.
route[CDR_ENQUEUE] {
    $var(cdr_body) = '{"source":"kamailio","event":"' + $var(cdr_event) + '","callId":"' + $(ci{s.escape.common}) + '","from":"' + $(fU{s.escape.common}) + '","to":"' + $(tU{s.escape.common}) + '","requestUser":"' + $(rU{s.escape.common}) + '","flow":"' + $var(cdr_flow) + '","routeToken":"' + $(hdr(X-Vocivo-Route-Token){s.escape.common}) + '","destinationExtension":"' + $(hdr(X-Vocivo-Destination-Extension){s.escape.common}) + '","destinationName":"' + $(hdr(X-Vocivo-Destination-Name){s.escape.common}) + '","at":' + $TS + '}';
    if (!mq_add("cdr", "$ci", "$var(cdr_body)")) {
        xlog("L_WARN", "sip-cdr queue refused $ci ($var(cdr_event))\n");
    }
}

# Every second, in the timer process, so signalling never waits on the API.
route[CDR_FLUSH] {
    $var(cdr_n) = 0;
    while (mq_fetch("cdr")) {
        if (http_client_query("http://127.0.0.1:8081/sip-cdr", $mqv(cdr), "application/json", "$var(cdr_res)") < 0) {
            xlog("L_WARN", "sip-cdr post failed for $mqk(cdr)\n");
        }
        $var(cdr_n) = $var(cdr_n) + 1;
        if ($var(cdr_n) >= 50) {
            break;
        }
    }
}

route[FORK_FS] {
    # FreeSWITCH SIP is localhost-only so the public internet cannot hairpin PSTN.
    $ru = "sip:" + $rU + "@127.0.0.1:5080";
    $du = "sip:127.0.0.1:5080;transport=udp";
    $rd = "127.0.0.1";
    $rp = "5080";
    setflag(FLT_FS);
    force_send_socket(udp:0.0.0.0:5060);
    if (is_method("INVITE")) {
        t_on_failure("MANAGE_FAILURE");
    }
    route(RELAY);
}

route[WAKEUP_NOW] {
    $avp(uuid) = "";
    # Escaped, all four: a caller whose display name held a quote — "Musa
    # "Mo" Usman", or any name with an apostrophe — produced JSON the wakeup
    # endpoint could not parse, and the callee's phone was never pushed.
    $var(body) = '{"username":"' + $(rU{s.escape.common}) + '","callId":"' + $(ci{s.escape.common}) + '","callerName":"' + $(fn{s.escape.common}) + '","from":"' + $(fU{s.escape.common}) + '"}';
    $var(url) = "http://127.0.0.1:8081/sip-wakeup";
    http_client_query($var(url), $var(body), "application/json", "$var(wake)");
    if ($var(wake) =~ "^\\{") {
        jansson_get("uuid", "$var(wake)", "$avp(uuid)");
    }
}

route[WAIT_REGISTER] {
    if (lookup("location")) {
        xlog("L_INFO", "INVITE $fU -> $rU registered after wakeup proto=$proto\n");
        if ($avp(uuid) != "") {
            append_hf("X-Vocivo-Call-UUID: $avp(uuid)\r\n");
        }
        rtpengine_manage("replace-origin replace-session-connection ICE=force DTLS=passive SDES-off RTCP-MUX RTP/SAVPF");
        t_on_failure("WAKEUP");
        route(RELAY);
        exit;
    }
    if ($avp(waited) == 1) {
        if ($sht(cdr=>$ci) != $null) {
            $var(cdr_flow) = "";
            $var(cdr_event) = "failed";
            route(CDR_ENQUEUE);
            $sht(cdr=>$ci) = $null;
        }
        sl_send_reply("480", "Temporarily Unavailable");
        exit;
    }
    $avp(waited) = 1;
    if (!async_route("WAIT_REGISTER", "8")) {
        xlog("L_ERR", "WAIT_REGISTER suspend failed $rU\n");
        sl_send_reply("480", "Temporarily Unavailable");
        exit;
    }
}

failure_route[WAKEUP] {
    if (t_is_canceled()) exit;
    route(WAKEUP_NOW);
    if (lookup("location")) {
        rtpengine_manage("replace-origin replace-session-connection ICE=force DTLS=passive SDES-off RTCP-MUX RTP/SAVPF");
        t_relay();
        exit;
    }
    # No second try: the negative reply goes back to the caller, and the
    # media session it was offered is released with it.
    rtpengine_manage();
    if ($sht(cdr=>$ci) != $null) {
        $var(cdr_flow) = "";
        $var(cdr_event) = "failed";
        route(CDR_ENQUEUE);
        $sht(cdr=>$ci) = $null;
    }
}

# For the transactions that have no wake-up retry: a failed call must not
# keep its media ports.
failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) exit;
    rtpengine_manage();
}

onreply_route[MANAGE_REPLY] {
    if (status == "200" && $rm == "INVITE" && $sht(cdr=>$ci) != $null) {
        $var(cdr_flow) = "";
        $var(cdr_event) = "answered";
        route(CDR_ENQUEUE);
    }
    if (has_body("application/sdp") && status =~ "183|2[0-9][0-9]") {
        if (isflagset(FLT_FS)) {
            rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
        } else {
            rtpengine_manage("replace-origin replace-session-connection ICE=force DTLS=passive SDES-off RTCP-MUX RTP/SAVPF");
        }
    }
}

route[RELAY] {
    if (is_method("CANCEL")) {
        if (!t_relay()) sl_reply_error();
        exit;
    }
    if (!isflagset(FLT_FS)) {
        handle_ruri_alias();
        if (!t_relay()) sl_reply_error();
        exit;
    }
    xlog("L_INFO", "RELAY FS $rm $fU -> $rU du=$du proto=$proto\n");
    if (!t_relay()) sl_reply_error();
    exit;
}
