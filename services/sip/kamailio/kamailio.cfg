#!KAMAILIO
# Vocivo SIP edge: registrar + fork for internal AORs, PSTN to FreeSWITCH, media via RTPEngine.
# Authentication is Digest verified by the Vocivo API. SIP passwords never live in this image.

#!define FLT_NATS 1
#!define FLT_ACC 2
#!define FLT_FS 3

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tcp:0.0.0.0:7443
listen=tcp:127.0.0.1:8080

alias=sip.vocivo.app

tcp_accept_no_cl=yes

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "http_client.so"
loadmodule "async.so"
loadmodule "jansson.so"
loadmodule "auth.so"
loadmodule "uac.so"
loadmodule "dispatcher.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"

modparam("usrloc", "db_mode", 0)
modparam("async", "workers", 16)
modparam("registrar", "method_filtering", 1)
modparam("registrar", "append_branches", 1)
modparam("registrar", "max_contacts", 8)
modparam("registrar", "received_avp", "$avp(RECEIVED)")
modparam("nathelper", "received_avp", "$avp(RECEIVED)")
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)
modparam("websocket", "keepalive_mechanism", 1)
modparam("websocket", "keepalive_timeout", 120)
modparam("websocket", "cors_mode", 2)
modparam("sanity", "autodrop", 0)

event_route[xhttp:request] {
    if ($Rp != 8080) {
        xhttp_reply("403", "Forbidden", "", "");
        exit;
    }
    if (!ws_handle_handshake()) {
        xlog("L_WARN", "websocket handshake failed from $si\n");
        exit;
    }
}

route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    # WebSocket frames are already delimited. sanity check_cl() 400s native iOS
    # REGISTER and can hide Authorization on the digest retry.
    if ($Rp != 8080 && !sanity_check("1511", "7")) {
        xlog("L_WARN", "malformed SIP from $si $rm $rU\n");
        sl_send_reply("400", "Bad Request");
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (nat_uac_test("64") || $Rp == 8080) {
        force_rport();
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else if (!add_contact_alias()) {
            xlog("L_WARN", "websocket contact alias failed from $si $rm $rU proto=$proto rp=$Rp\n");
        }
    }

    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    if (is_method("INVITE|ACK|BYE|CANCEL|UPDATE|PRACK")) {
        if (nat_uac_test("19")) {
            setflag(FLT_NATS);
            force_rport();
        }
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) route(RELAY);
        exit;
    }

    if (is_method("INVITE")) {
        t_on_reply("MANAGE_REPLY");
        route(INVITE);
        exit;
    }

    if (is_method("REFER|NOTIFY")) {
        route(REFER);
        exit;
    }

    if (loose_route()) {
        route(RELAY);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) route(RELAY);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

route[REGISTER] {
    # UDP scanners hammer numeric From-users. Do not spend sip-auth (or async
    # workers) on them or WebSocket REGISTER from vocivo.app stalls with 1006.
    if ($Rp != 8080 && $fU =~ "^[0-9]{1,8}$") {
        sl_send_reply("403", "Forbidden");
        exit;
    }
    xlog("L_WARN", "REGISTER $fU proto=$proto rp=$Rp cl=$cl\n");
    if (!is_present_hf("Authorization")) {
        xlog("L_WARN", "REGISTER challenge $fU\n");
        www_challenge("$env(VOCIVO_SIP_REALM)", "1");
        exit;
    }
    if (!route(AUTH)) {
        xlog("L_WARN", "REGISTER auth failed $fU\n");
        www_challenge("$env(VOCIVO_SIP_REALM)", "1");
        exit;
    }
    if (!save("location")) {
        xlog("L_WARN", "REGISTER save failed $fU contact=$ct\n");
        sl_reply_error();
        exit;
    }
    xlog("L_WARN", "REGISTER ok $fU from $si transport=$proto\n");
    exit;
}

route[AUTH] {
    $var(body) = '{"method":"' + $rm + '","authorization":"' + $(hdr(Authorization){s.escape.common}) + '"}';
    $var(url) = "http://127.0.0.1:8081/sip-auth";
    if (http_client_query($var(url), $var(body), "application/json", "$var(res)") < 0) {
        xlog("L_ERR", "sip-auth unreachable for $fU\n");
        send_reply("500", "Auth service unavailable");
        exit;
    }
    if ($var(res) =~ "\"ok\"\\s*:\\s*true") {
        return 1;
    }
    xlog("L_WARN", "sip-auth rejected $fU: $var(res)\n");
    return -1;
}

route[REFER] {
    if (!has_totag()) {
        record_route();
    }
    if ($rU =~ "^conf-") {
        rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
        route(FORK_FS);
        exit;
    }
    if (lookup("location")) {
        rtpengine_manage("replace-origin replace-session-connection ICE=force RTP/SAVPF");
        route(RELAY);
        exit;
    }
    sl_send_reply("404", "Not Found");
    exit;
}

route[INVITE] {
    if (!has_totag()) {
        record_route();
    }

    if ($rU =~ "^conf-") {
        if (!is_present_hf("X-Vocivo-Flow")) {
            append_hf("X-Vocivo-Flow: conference\r\n");
        }
        rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
        route(FORK_FS);
        exit;
    }

    if ($rU =~ "^\+?[1-9][0-9]{6,14}$") {
        if (!is_present_hf("X-Vocivo-Flow")) {
            if (is_present_hf("X-Vocivo-Caller-ID") || is_present_hf("X-Vocivo-Route-ID")) {
                append_hf("X-Vocivo-Flow: outbound\r\n");
            } else {
                append_hf("X-Vocivo-Flow: inbound\r\n");
            }
        }
        rtpengine_manage("replace-origin replace-session-connection RTP/AVP");
        route(FORK_FS);
        exit;
    }

    # Scanner INVITEs to 5050/6666 must not occupy async workers or sip-wakeup.
    if ($rU =~ "^[0-9]{1,8}$") {
        sl_send_reply("404", "Not Found");
        exit;
    }

    # Wake the iPhone, then fork whoever is already registered (usually web).
    # Do not async-wait when a contact exists: that starved the 4 async workers
    # and closed live WSS sessions with 1006 while scanners INVITEd junk AORs.
    xlog("L_INFO", "INVITE $fU -> $rU sip-wakeup then fork registered contacts\n");
    route(WAKEUP_NOW);
    if (lookup("location")) {
        xlog("L_INFO", "INVITE $fU -> $rU registered proto=$proto\n");
        if ($avp(uuid) != "") {
            append_hf("X-Vocivo-Call-UUID: $avp(uuid)\r\n");
        }
        rtpengine_manage("replace-origin replace-session-connection ICE=force RTP/SAVPF");
        t_on_failure("WAKEUP");
        route(RELAY);
        exit;
    }
    $avp(tries) = 0;
    route(WAIT_REGISTER);
    exit;
}

route[FORK_FS] {
    # Sofia binds the droplet public IP, not 127.0.0.1. WebSocket INVITEs also
    # have to switch to UDP or t_relay keeps proto=ws and FreeSWITCH never sees them.
    $var(fsip) = $env(PUBLIC_IP);
    if ($var(fsip) == "") {
        $var(fsip) = "127.0.0.1";
    }
    $ru = "sip:" + $rU + "@" + $var(fsip) + ":5080";
    $du = "sip:" + $var(fsip) + ":5080;transport=udp";
    $rd = $var(fsip);
    $rp = "5080";
    setflag(FLT_FS);
    force_send_socket(udp:0.0.0.0:5060);
    route(RELAY);
}

route[WAKEUP_NOW] {
    $avp(uuid) = "";
    $var(body) = '{"username":"' + $rU + '","callId":"' + $ci + '","callerName":"' + $fn + '","from":"' + $fU + '"}';
    $var(url) = "http://127.0.0.1:8081/sip-wakeup";
    http_client_query($var(url), $var(body), "application/json", "$var(wake)");
    jansson_get("uuid", "$var(wake)", "$avp(uuid)");
}

route[WAIT_REGISTER] {
    if (lookup("location")) {
        xlog("L_INFO", "INVITE $fU -> $rU registered after wakeup proto=$proto\n");
        if ($avp(uuid) != "") {
            append_hf("X-Vocivo-Call-UUID: $avp(uuid)\r\n");
        }
        rtpengine_manage("replace-origin replace-session-connection ICE=force RTP/SAVPF");
        t_on_failure("WAKEUP");
        route(RELAY);
        exit;
    }
    $avp(tries) = $avp(tries) + 1;
    if ($avp(tries) > 6) {
        sl_send_reply("480", "Temporarily Unavailable");
        exit;
    }
    async_route("WAIT_REGISTER", "1");
}

failure_route[WAKEUP] {
    if (t_is_canceled()) exit;
    route(WAKEUP_NOW);
}

onreply_route[MANAGE_REPLY] {
    if (has_body("application/sdp") && status =~ "183|2[0-9][0-9]") {
        rtpengine_manage("replace-origin replace-session-connection ICE=force RTP/SAVPF");
    }
}

route[RELAY] {
    if (is_method("CANCEL")) {
        if (!t_relay()) sl_reply_error();
        exit;
    }
    if (!isflagset(FLT_FS)) {
        handle_ruri_alias();
        if (!t_relay()) sl_reply_error();
        exit;
    }
    xlog("L_INFO", "RELAY FS $rm $fU -> $rU du=$du proto=$proto\n");
    if (!t_relay()) sl_reply_error();
    exit;
}
