#!KAMAILIO
# Vocivo SIP edge: registrar + fork for internal AORs, PSTN to FreeSWITCH, media via RTPEngine.
# Authentication is Digest verified by the Vocivo API. SIP passwords never live in this image.

#!define FLT_NATS 1
#!define FLT_ACC 2

listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
listen=tcp:0.0.0.0:7443
listen=tcp:127.0.0.1:8080

alias=sip.vocivo.app

tcp_accept_no_cl=yes

loadmodule "jsonrpcs.so"
loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "nathelper.so"
loadmodule "rtpengine.so"
loadmodule "http_client.so"
loadmodule "jansson.so"
loadmodule "auth.so"
loadmodule "uac.so"
loadmodule "dispatcher.so"
loadmodule "xhttp.so"
loadmodule "websocket.so"

modparam("usrloc", "db_mode", 0)
modparam("registrar", "method_filtering", 1)
modparam("registrar", "max_contacts", 8)
modparam("rtpengine", "rtpengine_sock", "udp:127.0.0.1:2223")
modparam("http_client", "httpcon", "vocivo=>https://vocivo.app")
modparam("dispatcher", "list_file", "/etc/kamailio/dispatcher.list")
modparam("tm", "fr_timer", 5000)
modparam("tm", "fr_inv_timer", 120000)

event_route[xhttp:request] {
    if ($Rp != 8080) {
        xhttp_reply("403", "Forbidden", "", "");
        exit;
    }
    if (!ws_handle_handshake()) {
        xlog("L_WARN", "websocket handshake failed from $si\n");
        exit;
    }
}

route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "malformed SIP from $si\n");
        exit;
    }

    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    if (is_method("INVITE|ACK|BYE|CANCEL|UPDATE|PRACK")) {
        if (nat_uac_test("19")) {
            setflag(FLT_NATS);
            force_rport();
        }
    }

    if (is_method("INVITE")) {
        route(INVITE);
        exit;
    }

    if (loose_route()) {
        route(RELAY);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) route(RELAY);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
}

route[REGISTER] {
    if (!is_present_hf("Authorization")) {
        www_challenge("$env(VOCIVO_SIP_REALM)", "1");
        exit;
    }
    if (!route(AUTH)) {
        www_challenge("$env(VOCIVO_SIP_REALM)", "1");
        exit;
    }
    if (!save("location")) {
        sl_reply_error();
        exit;
    }
    exit;
}

route[AUTH] {
    $var(body) = '{"username":"' + $(hdr(Authorization){param.value,username}{s.unquote})
        + '","realm":"' + $(hdr(Authorization){param.value,realm}{s.unquote})
        + '","nonce":"' + $(hdr(Authorization){param.value,nonce}{s.unquote})
        + '","uri":"' + $(hdr(Authorization){param.value,uri}{s.unquote})
        + '","response":"' + $(hdr(Authorization){param.value,response}{s.unquote})
        + '","cnonce":"' + $(hdr(Authorization){param.value,cnonce}{s.unquote})
        + '","nc":"' + $(hdr(Authorization){param.value,nc}{s.unquote})
        + '","qop":"' + $(hdr(Authorization){param.value,qop}{s.unquote})
        + '","method":"' + $rm + '"}';
    $var(url) = "http://127.0.0.1:8081/sip-auth";
    if (http_client_query($var(url), $var(body), "application/json", "$var(res)") < 0) {
        xlog("L_ERR", "sip-auth unreachable for $fU\n");
        send_reply("500", "Auth service unavailable");
        exit;
    }
    if ($var(res) =~ "\"ok\"\\s*:\\s*true") {
        return 1;
    }
    return -1;
}

route[INVITE] {
    if (!has_totag()) {
        record_route();
    }
    rtpengine_manage("replace-origin replace-session-connection");

    if ($rU =~ "^\+?[1-9][0-9]{6,14}$") {
        $du = "sip:127.0.0.1:5080";
        route(RELAY);
        exit;
    }

    if (lookup("location")) {
        t_on_failure("WAKEUP");
        route(RELAY);
        exit;
    }

    route(WAKEUP_NOW);
    send_reply("480", "Temporarily Unavailable");
}

route[WAKEUP_NOW] {
    $var(body) = '{"username":"' + $rU + '","callId":"' + $ci + '","callerName":"' + $fn + '"}';
    $var(url) = "http://127.0.0.1:8081/sip-wakeup";
    http_client_query($var(url), $var(body), "application/json", "$var(wake)");
}

failure_route[WAKEUP] {
    if (t_is_canceled()) exit;
    route(WAKEUP_NOW);
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
