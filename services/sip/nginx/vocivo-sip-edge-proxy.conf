# Copied to /etc/nginx/snippets/vocivo-sip-edge-proxy.conf on the SIP droplet.
# Replace the bearer token with SIP_EDGE_SECRET from the droplet environment.
# Never commit a live SIP_EDGE_SECRET.

proxy_http_version 1.1;
proxy_ssl_server_name on;
proxy_set_header Host vocivo.app;
proxy_set_header Content-Type application/json;
proxy_set_header Authorization "Bearer CHANGE_ME";
proxy_connect_timeout 5s;
proxy_read_timeout 8s;
