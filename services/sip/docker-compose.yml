services:
  rtpengine:
    image: drachtio/rtpengine:latest
    restart: unless-stopped
    network_mode: host
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    entrypoint: ["rtpengine"]
    command:
      - --interface=${PUBLIC_IP:-127.0.0.1}
      - --listen-ng=127.0.0.1:2223
      - --port-min=${RTP_START:-16384}
      - --port-max=${RTP_END:-16484}
      - --foreground
      - --log-level=5

  kamailio:
    image: ghcr.io/kamailio/kamailio-ci:5.8.4-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rtpengine
      - freeswitch
    environment:
      VOCIVO_SIP_REALM: ${VOCIVO_SIP_REALM:-sip.vocivo.app}
      VOCIVO_API_URL: ${VOCIVO_API_URL:-https://vocivo.app}
      SIP_EDGE_SECRET: ${SIP_EDGE_SECRET:?SIP_EDGE_SECRET is required}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./kamailio/dispatcher.list:/etc/kamailio/dispatcher.list:ro
      - ./kamailio/usrloc-init.sql:/etc/kamailio/usrloc-init.sql:ro
      - ./kamailio/docker-entrypoint.sh:/entrypoint.sh:ro
      - kamailio-usrloc:/var/lib/kamailio
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  freeswitch:
    image: safarov/freeswitch:latest
    restart: unless-stopped
    network_mode: host
    environment:
      VOCIVO_API_URL: ${VOCIVO_API_URL:-https://vocivo.app}
      SIP_EDGE_SECRET: ${SIP_EDGE_SECRET:?SIP_EDGE_SECRET is required}
      TELNYX_SIP_HOST: ${TELNYX_SIP_HOST:-sip.telnyx.com}
      TELNYX_SIP_USERNAME: ${TELNYX_SIP_USERNAME:-}
      TELNYX_SIP_PASSWORD: ${TELNYX_SIP_PASSWORD:-}
      TELNYX_SIP_AUTH_TOKEN: ${TELNYX_SIP_AUTH_TOKEN:-}
      TELNYX_SIP_REALM: ${TELNYX_SIP_REALM:-sip.telnyx.com}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      VOCIVO_SIP_INBOUND: ${VOCIVO_SIP_INBOUND:-0}
    volumes:
      - freeswitch-etc:/etc/freeswitch
      - ./freeswitch:/opt/vocivo-fs:ro
      # Shared with the receptionist: it writes the prompts FreeSWITCH plays
      # and reads the turns FreeSWITCH records, so both must see one path.
      - receptionist-audio:/var/lib/vocivo-receptionist
    entrypoint: ["/bin/sh", "/opt/vocivo-fs/docker-entrypoint.sh"]

  # Vocivo's own AI receptionist. FreeSWITCH hands it a call over the Event
  # Socket on loopback; it answers with faster-whisper for what the caller
  # said and the Kokoro service for what it says back. Only the language-model
  # turn leaves this machine.
  receptionist:
    build: ../receptionist
    image: vocivo-receptionist:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      - freeswitch
    environment:
      RECEPTIONIST_PORT: ${RECEPTIONIST_PORT:-8084}
      TTS_SERVICE_URL: ${RECEPTIONIST_TTS_URL:-http://127.0.0.1:8000}
      TTS_SERVICE_SECRET: ${TTS_SERVICE_SECRET:?TTS_SERVICE_SECRET is required}
      STT_MODEL: ${STT_MODEL:-base}
      STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:-claude-3-5-haiku-latest}
      VOCIVO_API_URL: ${VOCIVO_API_URL:-https://vocivo.app}
      SIP_EDGE_SECRET: ${SIP_EDGE_SECRET:?SIP_EDGE_SECRET is required}
    # Speech recognition is CPU-bound and must never crowd out the processes
    # carrying live audio.
    cpus: 1.5
    mem_limit: 2g
    volumes:
      - receptionist-audio:/var/lib/vocivo-receptionist

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - --log-file=stdout
      - --listening-port=3478
      - --external-ip=${PUBLIC_IP:-127.0.0.1}
      - --realm=${VOCIVO_SIP_REALM:-sip.vocivo.app}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-changeme}
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --min-port=49152
      - --max-port=49200
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  freeswitch-etc:
  kamailio-usrloc:
  receptionist-audio:
