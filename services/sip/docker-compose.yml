services:
  rtpengine:
    image: drachtio/rtpengine:latest
    restart: unless-stopped
    network_mode: host
    environment:
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    entrypoint: ["rtpengine"]
    command:
      - --interface=${PUBLIC_IP:-127.0.0.1}
      - --listen-ng=127.0.0.1:2223
      - --port-min=${RTP_START:-16384}
      - --port-max=${RTP_END:-16484}
      - --foreground
      - --log-level=5

  kamailio:
    image: ghcr.io/kamailio/kamailio-ci:5.8.4-alpine
    restart: unless-stopped
    network_mode: host
    depends_on:
      - rtpengine
      - freeswitch
    environment:
      VOCIVO_SIP_REALM: ${VOCIVO_SIP_REALM:-sip.vocivo.app}
      VOCIVO_API_URL: ${VOCIVO_API_URL:-https://vocivo.app}
      SIP_EDGE_SECRET: ${SIP_EDGE_SECRET:?SIP_EDGE_SECRET is required}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      # Inbound over the trunk is refused unless both of these are set: the
      # flag, and the carrier signalling addresses it may arrive from.
      VOCIVO_SIP_INBOUND: ${VOCIVO_SIP_INBOUND:-0}
      VOCIVO_TRUNK_SOURCES: ${VOCIVO_TRUNK_SOURCES:-}
    volumes:
      - ./kamailio/kamailio.cfg:/etc/kamailio/kamailio.cfg:ro
      - ./kamailio/dispatcher.list:/etc/kamailio/dispatcher.list:ro
      - ./kamailio/usrloc-init.sql:/etc/kamailio/usrloc-init.sql:ro
      - ./kamailio/docker-entrypoint.sh:/entrypoint.sh:ro
      - kamailio-usrloc:/var/lib/kamailio
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  freeswitch:
    image: safarov/freeswitch:latest
    restart: unless-stopped
    network_mode: host
    environment:
      VOCIVO_API_URL: ${VOCIVO_API_URL:-https://vocivo.app}
      SIP_EDGE_SECRET: ${SIP_EDGE_SECRET:?SIP_EDGE_SECRET is required}
      TELNYX_SIP_HOST: ${TELNYX_SIP_HOST:-sip.telnyx.com}
      TELNYX_SIP_USERNAME: ${TELNYX_SIP_USERNAME:-}
      TELNYX_SIP_PASSWORD: ${TELNYX_SIP_PASSWORD:-}
      TELNYX_SIP_AUTH_TOKEN: ${TELNYX_SIP_AUTH_TOKEN:-}
      TELNYX_SIP_REALM: ${TELNYX_SIP_REALM:-sip.telnyx.com}
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      VOCIVO_SIP_INBOUND: ${VOCIVO_SIP_INBOUND:-0}
    volumes:
      - freeswitch-etc:/etc/freeswitch
      - ./freeswitch:/opt/vocivo-fs:ro
      # The image ships no CA bundle, so nothing in FreeSWITCH could speak
      # HTTPS to the API. The host's bundle stands in; the entrypoint also
      # copies it to /etc/freeswitch/tls/cacert.pem, where FreeSWITCH's own
      # modules look for one.
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      # Shared with the receptionist container, which is deployed separately
      # by Ops · Droplets → receptionist-deploy: it writes the prompts
      # FreeSWITCH plays and reads the turns FreeSWITCH records, so the two
      # must see one path. It is not a compose service because its secrets
      # would then be required to bring up the whole stack — and a missing one
      # makes `docker compose config` reject the file, taking SIP down with it.
      - receptionist-audio:/var/lib/vocivo-receptionist
    entrypoint: ["/bin/sh", "/opt/vocivo-fs/docker-entrypoint.sh"]

  coturn:
    image: coturn/coturn:4.6
    restart: unless-stopped
    network_mode: host
    command:
      - --log-file=stdout
      - --listening-port=3478
      - --external-ip=${PUBLIC_IP:-127.0.0.1}
      - --realm=${VOCIVO_SIP_REALM:-sip.vocivo.app}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-changeme}
      - --fingerprint
      - --no-cli
      - --no-tls
      - --no-dtls
      - --min-port=49152
      - --max-port=49200
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

volumes:
  freeswitch-etc:
  kamailio-usrloc:
  receptionist-audio:
