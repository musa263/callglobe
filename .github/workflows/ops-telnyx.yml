name: Ops · Telnyx

# Manual, read-mostly operations against Telnyx. The only writes are
# set-trunk-port (the port on an IP trunk's authorised IP entries) and
# route-number (re-pointing ONE phone number to a connection per run — the
# cut-over step that moves a DID from Call Control to the SIP trunk).
#
# Required repository secret: TELNYX_API_KEY

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options: [list-connections, show-connection, set-trunk-port, list-numbers, show-number, route-number]
      number:
        description: E.164 phone number (for show-number / route-number), e.g. +15551230000
        required: false
        type: string
      connection_id:
        description: Connection id (for show-connection / set-trunk-port / route-number) — the FQDN/IP SIP trunk connection
        required: false
        type: string
      port:
        description: SIP port Telnyx should deliver inbound INVITEs to (for set-trunk-port) — 5080 is FreeSWITCH's external profile on the edge
        required: false
        type: string

concurrency:
  group: ops-telnyx
  cancel-in-progress: false

jobs:
  telnyx:
    name: ${{ inputs.action }} ${{ inputs.number }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate inputs
        env:
          ACTION: ${{ inputs.action }}
          NUMBER: ${{ inputs.number }}
          CONNECTION_ID: ${{ inputs.connection_id }}
          PORT: ${{ inputs.port }}
        run: |
          set -euo pipefail
          case "$ACTION" in
            show-number|route-number)
              [[ "$NUMBER" =~ ^\+[1-9][0-9]{6,14}$ ]] || { echo "::error::number must be E.164, e.g. +15551230000"; exit 1; };;
          esac
          case "$ACTION" in
            show-connection|set-trunk-port|route-number)
              [[ "$CONNECTION_ID" =~ ^[0-9]{6,32}$ ]] || { echo "::error::connection_id must be a numeric Telnyx connection id"; exit 1; };;
          esac
          if [ "$ACTION" = set-trunk-port ]; then
            [[ "$PORT" =~ ^(5060|5061|5080)$ ]] || { echo "::error::port must be 5060, 5061 or 5080"; exit 1; }
          fi

      - name: Run
        env:
          TELNYX_API_KEY: ${{ secrets.TELNYX_API_KEY }}
          ACTION: ${{ inputs.action }}
          NUMBER: ${{ inputs.number }}
          CONNECTION_ID: ${{ inputs.connection_id }}
          PORT: ${{ inputs.port }}
        run: |
          set -euo pipefail
          [ -n "$TELNYX_API_KEY" ] || { echo "::error::TELNYX_API_KEY secret is missing"; exit 1; }
          # --globoff: Telnyx query params use [] (page[size]) which curl would otherwise treat as glob ranges.
          api() { curl --globoff --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $TELNYX_API_KEY" -H "Content-Type: application/json" "$@"; }
          base=https://api.telnyx.com/v2
          # Mirror each report into a check-run annotation so it is readable through the API, not only the raw log.
          # Full output to the job summary (readable in full through the checks API);
          # a short head to an annotation for the run list.
          report() {
            local title=$1 body head
            body=$(cat)
            printf '%s\n' "$body"
            { echo "### $title"; echo; echo '```'; printf '%s\n' "$body"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            head=${body:0:2000}
            echo "::notice title=${title}::${head//$'\n'/%0A}"
          }

          case "$ACTION" in
            list-connections)
              {
                echo "== Call Control applications =="
                api "$base/call_control_applications?page[size]=50" | jq -r '.data[] | "\(.id)\t\(.application_name)\tactive=\(.active)"'
                echo; echo "== FQDN connections (SIP trunks by hostname) =="
                api "$base/fqdn_connections?page[size]=50" | jq -r '.data[] | "\(.id)\t\(.connection_name)\tactive=\(.active)"'
                echo; echo "== IP connections (SIP trunks by IP) =="
                api "$base/ip_connections?page[size]=50" | jq -r '.data[] | "\(.id)\t\(.connection_name)\tactive=\(.active)"'
                echo; echo "== Credential connections (WebRTC / SIP credentials) =="
                api "$base/credential_connections?page[size]=50" | jq -r '.data[] | "\(.id)\t\(.connection_name)\tactive=\(.active)"'
              } | report connections
              ;;
            show-connection)
              {
                # Try each connection type; exactly one will answer for a given id.
                for kind in ip_connections fqdn_connections credential_connections call_control_applications; do
                  if body=$(api "$base/$kind/$CONNECTION_ID" 2>/dev/null); then
                    echo "== $kind/$CONNECTION_ID =="
                    echo "$body" | jq '.data | {connection_name, application_name, active, transport_protocol, inbound: (.inbound // {}), outbound: (.outbound // {}), webhook_event_url, anchorsite_override, default_on_hold_comfort_noise_enabled} | with_entries(select(.value != null))'
                    case "$kind" in
                      ip_connections)
                        echo "-- authorised IPs (Telnyx sends inbound INVITEs here) --"
                        api "$base/ips?filter[connection_id]=$CONNECTION_ID&page[size]=50" | jq -r '.data[] | "\(.ip_address):\(.port // 5060)"';;
                      fqdn_connections)
                        echo "-- FQDNs --"
                        api "$base/fqdns?filter[connection_id]=$CONNECTION_ID&page[size]=50" | jq -r '.data[] | "\(.fqdn):\(.port // 5060) (\(.dns_record_type))"';;
                    esac
                    echo "-- numbers currently on this connection --"
                    api "$base/phone_numbers?filter[connection_id]=$CONNECTION_ID&page[size]=250" | jq -r '.data[] | .phone_number' | sed 's/^/  /'
                    break
                  fi
                done
              } | report "connection $CONNECTION_ID"
              ;;
            set-trunk-port)
              {
                # Every authorised IP on the connection is where Telnyx delivers inbound; move them all to the new port.
                ids=$(api "$base/ips?filter[connection_id]=$CONNECTION_ID&page[size]=50" | jq -r '.data[].id')
                [ -n "$ids" ] || { echo "::error::connection $CONNECTION_ID has no authorised IP entries (is it an IP connection?)"; exit 1; }
                for ipid in $ids; do
                  before=$(api "$base/ips/$ipid" | jq -r '.data | "\(.ip_address):\(.port // 5060)"')
                  api -X PATCH "$base/ips/$ipid" -d "{\"port\":$PORT}" >/dev/null
                  after=$(api "$base/ips/$ipid" | jq -r '.data | "\(.ip_address):\(.port // 5060)"')
                  echo "$before -> $after"
                done
              } | report "trunk port $CONNECTION_ID"
              ;;
            list-numbers)
              {
                printf '%-18s %-22s %-36s %s\n' NUMBER CONNECTION_ID CONNECTION_NAME STATUS
                for page in 1 2 3 4; do
                  api "$base/phone_numbers?page[size]=250&page[number]=$page" | jq -r '.data[] | [.phone_number, (.connection_id // "-"), (.connection_name // "-"), .status] | @tsv' \
                    | awk -F'\t' '{ printf "%-18s %-22s %-36s %s\n", $1, $2, $3, $4 }'
                done
              } | report numbers
              ;;
            show-number)
              api "$base/phone_numbers?filter[phone_number]=$(printf %s "$NUMBER" | sed 's/+/%2B/')" | jq '.data[] | {id, phone_number, status, connection_id, connection_name, messaging_profile_id, emergency_enabled}' | report "$NUMBER"
              ;;
            route-number)
              id=$(api "$base/phone_numbers?filter[phone_number]=$(printf %s "$NUMBER" | sed 's/+/%2B/')" | jq -r '.data[0].id // empty')
              [ -n "$id" ] || { echo "::error::$NUMBER is not on this Telnyx account"; exit 1; }
              { echo "before:"; api "$base/phone_numbers/$id" | jq -c '.data | {phone_number, connection_id, connection_name}'; } | report "before $NUMBER"
              api -X PATCH "$base/phone_numbers/$id" -d "{\"connection_id\":\"$CONNECTION_ID\"}" >/dev/null
              { echo "after:";  api "$base/phone_numbers/$id" | jq -c '.data | {phone_number, connection_id, connection_name}'; } | report "after $NUMBER"
              echo "::notice::$NUMBER now routes to connection $CONNECTION_ID. Inbound on this DID now arrives at that connection instead of Call Control."
              ;;
          esac
