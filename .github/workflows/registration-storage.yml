name: Registration storage validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'frontend/api/_lib/shared/object-store.ts'
      - 'frontend/scripts/test-registration-storage.mjs'
      - '.github/workflows/registration-storage.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/api/_lib/shared/object-store.ts'
      - 'frontend/scripts/test-registration-storage.mjs'
      - '.github/workflows/registration-storage.yml'
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: vocivo_registration_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: node --import tsx scripts/test-registration-storage.mjs
        working-directory: frontend
        env:
          VOCIVO_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:5432/vocivo_registration_test
